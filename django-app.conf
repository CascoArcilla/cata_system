<VirtualHost *:80>

    ServerName localhost

    ProxyPreserveHost On

    Alias /static/ /var/www/static/
    <Directory /var/www/static/>
        Require all granted
    </Directory>

    ProxyPass / http://app-django-sensorial:8000/
    ProxyPassReverse / http://app-django-sensorial:8000/

</VirtualHost>
