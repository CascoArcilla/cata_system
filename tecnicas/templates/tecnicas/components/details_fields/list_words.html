<h2 class="text-black font-bold text-2xl border-b-2">
    Palabras usadas para calificar
</h2>
<article
    class="text-white rounded-xl grid grid-cols-4 max-sm:grid-cols-1 gap-3">
    {% for palabra in palabras %}
    <section>
        <p class="block text-black text-xl bg-surface-sweet border-2 border-cts-border flex items-center justify-center gap-x-2 p-2 rounded-lg capitalize">
            {{ palabra }}
        </p>
    </section>
    {% endfor %}
</article>
